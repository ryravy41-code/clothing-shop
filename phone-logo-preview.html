<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phone Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      overflow: hidden;
    }
    .logo-wrap {
      width: clamp(80px, 30vw, 160px);
      aspect-ratio: 1 / 2;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#667eea"/>
          <stop offset="100%" stop-color="#764ba2"/>
        </linearGradient>
        <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff"/>
          <stop offset="100%" stop-color="#f0f0f5"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f093fb"/>
          <stop offset="100%" stop-color="#f5576c"/>
        </linearGradient>
        <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1a1a2e"/>
          <stop offset="100%" stop-color="#16213e"/>
        </linearGradient>
        <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#667eea" flood-opacity="0.3"/></filter>
      </defs>
      <rect width="100" height="200" rx="12" fill="url(#bg)"/>
      <rect x="5" y="8" width="90" height="184" rx="8" fill="url(#phone)" stroke="#ddd" stroke-width="0.5" filter="url(#sh)"/>
      <rect x="8" y="14" width="84" height="70" rx="4" fill="url(#screen)"/>
      <rect x="12" y="20" width="24" height="5" rx="2" fill="#667eea" opacity="0.8"/>
      <rect x="31" y="20" width="24" height="5" rx="2" fill="#f093fb" opacity="0.8"/>
      <rect x="50" y="20" width="24" height="5" rx="2" fill="#f5576c" opacity="0.8"/>
      <circle cx="50" cy="50" r="12" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
      <circle cx="50" cy="50" r="6" fill="url(#accent)" opacity="0.8"/>
      <path d="M50,34 Q56,41 50,48 Q44,41 50,34Z" fill="url(#accent)" opacity="0.6"/>
      <rect x="15" y="92" width="70" height="2" rx="1" fill="#fff" opacity="0.25"/>
      <rect x="20" y="99" width="60" height="1.5" rx="0.75" fill="#fff" opacity="0.2"/>
      <rect x="22" y="106" width="56" height="1.5" rx="0.75" fill="#fff" opacity="0.2"/>
      <rect x="18" y="113" width="64" height="1.5" rx="0.75" fill="#fff" opacity="0.2"/>
      <rect x="25" y="122" width="50" height="8" rx="4" fill="url(#accent)" opacity="0.7"/>
      <circle cx="25" cy="145" r="3" fill="#fff" opacity="0.25"/>
      <circle cx="32" cy="145" r="3" fill="#fff" opacity="0.25"/>
      <circle cx="39" cy="145" r="3" fill="#fff" opacity="0.25"/>
      <circle cx="46" cy="145" r="3" fill="#fff" opacity="0.25"/>
      <circle cx="53" cy="145" r="3" fill="#fff" opacity="0.25"/>
      <rect x="32" y="160" width="36" height="2" rx="1" fill="#fff" opacity="0.2"/>
      <circle cx="50" cy="5" r="2.5" fill="#fff" opacity="0.7"/>
      <circle cx="50" cy="5" r="1.2" fill="url(#accent)" opacity="0.8"/>
    </svg>
  </div>
</body>
</html>
